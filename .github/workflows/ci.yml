name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'aiops' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

jobs:
  test-orders-api:
    name: Test orders-api (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "app/orders-api/pyproject.toml"

      - name: Run pytest
        working-directory: app/orders-api
        run: uv run pytest -q

  test-payments:
    name: Test payments (go test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.23
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: app/payments/go.sum

      - name: Run go test
        working-directory: app/payments
        run: go test ./...

  debug-oidc:
    name: Debug OIDC token claims
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      # Diagnostic only — fetches the same OIDC token aws-actions/configure-aws-credentials
      # would request (audience=sts.amazonaws.com) and prints the claims AWS checks
      # against the role's trust policy. The raw JWT is never printed, only decoded claims.
      - name: Print OIDC token claims
        run: |
          RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          JWT=$(echo "$RESPONSE" | jq -r .value)
          PAYLOAD="${JWT#*.}"
          PAYLOAD="${PAYLOAD%.*}"
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_//}"
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, repository, repository_owner, ref, ref_type, workflow, event_name, actor}'

  build-push:
    name: Build & push (${{ matrix.service }})
    needs: [test-orders-api, test-payments]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, payments, worker, web]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: |
          ECR_HOST="${ECR_REGISTRY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_HOST"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg APP_VERSION="$IMAGE_TAG" \
            --build-arg APP_VARIANT=stable \
            --cache-from "type=gha,scope=$SERVICE" \
            --cache-to "type=gha,mode=max,scope=$SERVICE" \
            --tag "$ECR_REGISTRY/kantyna/$SERVICE:$IMAGE_TAG" \
            --push \
            "app/$SERVICE"

  deploy:
    name: Deploy (helm upgrade)
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Helm v4.3.0
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Helm upgrade
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade kantyna app/deploy/helm/kantyna \
            --namespace "$K8S_NAMESPACE" \
            --reuse-values \
            --set global.imageRegistry="$ECR_REGISTRY" \
            --set global.imageTag="$IMAGE_TAG"

      - name: Wait for rollout
        run: |
          for svc in orders-api payments worker web; do
            kubectl -n "$K8S_NAMESPACE" rollout status "deploy/kantyna-$svc" --timeout=120s
          done

      - name: Smoke test /healthz
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          kubectl -n "$K8S_NAMESPACE" run "smoke-test-$RUN_ID" --rm -i --restart=Never \
            --image=curlimages/curl:8.11.0 \
            -- curl -sf "http://kantyna-orders-api:8000/healthz"

