apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app: orders-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: kantyna/orders-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-api-secrets
                  key: database-url
            - name: PAYMENTS_URL
              value: "http://payments:8080"
            - name: QUEUE_URL
              value: ""
            - name: RECEIPTS_BUCKET
              value: ""
            - name: AWS_REGION
              value: "eu-central-1"
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_VARIANT
              value: "stable"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      restartPolicy: Always
